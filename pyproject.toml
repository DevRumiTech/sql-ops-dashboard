[project]
name = "sql-ops-dashboard"
version = "1.0.0"
description = "A Flask and SQLite retail operations analytics dashboard."
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "Flask>=3.0,<4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/init_db.py" = ["E402"]
