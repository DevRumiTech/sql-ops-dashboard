[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/init_db.py" = ["E402"]
